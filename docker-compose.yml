services:
  db:
    image: postgres:16-alpine
    container_name: bomtool_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glintech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glintech}
      POSTGRES_DB: ${POSTGRES_DB:-glintech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/glintechnology/bomtool-backend}:${IMAGE_TAG:-latest}
    container_name: bomtool_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-glintech}:${POSTGRES_PASSWORD:-glintech}@db:5432/${POSTGRES_DB:-glintech}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FILE_STORAGE_BACKEND: ${FILE_STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/data/uploads}
      DIGIKEY_CLIENT_ID: ${DIGIKEY_CLIENT_ID:-}
      DIGIKEY_CLIENT_SECRET: ${DIGIKEY_CLIENT_SECRET:-}
      DIGIKEY_ENV: ${DIGIKEY_ENV:-sandbox}
      MOUSER_API_KEY: ${MOUSER_API_KEY:-}
      TI_CLIENT_ID: ${TI_CLIENT_ID:-}
      TI_CLIENT_SECRET: ${TI_CLIENT_SECRET:-}
      SUPPLIER_API_TIMEOUT_SECONDS: ${SUPPLIER_API_TIMEOUT_SECONDS:-20}
      SUPPLIER_API_MAX_RETRIES: ${SUPPLIER_API_MAX_RETRIES:-2}
      SUPPLIER_API_MOCK: ${SUPPLIER_API_MOCK:-false}
      SUPPLIER_API_MOCK_ALLOW_EXPORT: ${SUPPLIER_API_MOCK_ALLOW_EXPORT:-false}
    expose:
      - "8000"
    volumes:
      - uploads_data:${LOCAL_STORAGE_DIR:-/data/uploads}

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/glintechnology/bomtool-frontend}:${IMAGE_TAG:-latest}
    container_name: bomtool_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "3000"

  gateway:
    image: nginx:1.27-alpine
    container_name: bomtool_gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 80;

          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Real-IP $$remote_addr;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;

          location /api/ {
            proxy_pass http://backend:8000;
          }

          location /docs {
            proxy_pass http://backend:8000;
          }

          location /openapi.json {
            proxy_pass http://backend:8000;
          }

          location /health {
            proxy_pass http://backend:8000;
          }

          location / {
            proxy_pass http://frontend:3000;
          }
        }
        EOF
        nginx -g 'daemon off;'

volumes:
  db_data:
  uploads_data:
